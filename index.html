<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Split Bill Camera</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",Arial,sans-serif}
*{box-sizing:border-box}
html,body,#app{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
body{color:#fff;-webkit-user-select:none;user-select:none}
#video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#050505}
#fallbackCamera{position:absolute;inset:0;background:#000;display:none;align-items:center;justify-content:center;text-align:center;padding:40px}
#fallbackCamera .card{max-width:320px;color:#fff}
#fallbackCamera button{margin-top:16px;border:0;border-radius:18px;padding:13px 18px;font-weight:700}
.layer{position:absolute;inset:0;pointer-events:none}
.topbar{position:absolute;top:calc(env(safe-area-inset-top) + 10px);left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:0 28px;z-index:4}
.control-group{display:flex;gap:9px;align-items:center}
.control{height:38px;min-width:38px;border:0;border-radius:21px;background:rgba(25,25,25,.70);color:#fff;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);display:flex;align-items:center;justify-content:center;padding:0 11px}
.control svg{width:20px;height:20px}
.control.text{font-size:12px;color:#ddd;font-weight:500}
#detectedTop{display:none;position:absolute;top:calc(env(safe-area-inset-top) + 72px);left:50%;transform:translateX(-50%);height:58px;background:rgba(26,26,28,.94);border-radius:29px;box-shadow:0 7px 28px rgba(0,0,0,.4);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);align-items:center;white-space:nowrap;overflow:hidden;z-index:6}
#detectedTop.show{display:flex}
.liveText{height:100%;padding:0 20px;display:flex;align-items:center;font-size:15px;font-weight:500}
.sep{height:30px;width:1px;background:#555}
.look{height:100%;padding:0 17px;display:flex;align-items:center;font-size:15px}
.chev{width:48px;height:48px;margin-right:5px;border-radius:50%;background:#46464a;display:grid;place-items:center}
.chev svg{width:24px;height:24px}
#detectedTools{display:none;position:absolute;top:calc(env(safe-area-inset-top) + 13px);right:26px;gap:7px;z-index:7}
#detectedTools.show{display:flex}
#billCard{display:none;position:absolute;left:18%;right:18%;top:20%;bottom:31%;border:1px solid rgba(255,255,255,.25);border-radius:5px;box-shadow:0 0 0 9999px rgba(0,0,0,0);z-index:2}
#billCard.show{display:block}
#scanLine{position:absolute;left:8%;right:8%;top:50%;height:1.5px;background:#5de12e;box-shadow:0 0 8px #5de12e;opacity:.8}
.bottom{position:absolute;left:0;right:0;bottom:0;padding:0 28px calc(env(safe-area-inset-bottom) + 24px);z-index:5}
.actionRow{height:64px;display:flex;align-items:center;justify-content:center;position:relative}
.side{position:absolute;bottom:4px;width:58px;height:58px;border:0;border-radius:50%;background:rgba(20,20,20,.78);color:#fff;display:grid;place-items:center;backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px)}
.side.left{left:0}.side.right{right:0}
.side svg{width:29px;height:29px}
.shutter{width:74px;height:74px;border-radius:50%;background:#929292;border:6px solid rgba(0,0,0,.65);box-shadow:0 0 0 2px rgba(255,255,255,.20)}
.modes{height:54px;display:flex;justify-content:center;align-items:center;margin-top:14px}
.modebar{height:48px;border-radius:25px;background:rgba(12,12,12,.72);padding:0 9px;display:flex;align-items:center;gap:6px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.mode{padding:8px 18px;border-radius:21px;color:#9a9a9f;font-size:18px;letter-spacing:.2px}
.mode.active{color:#d8c74a;background:rgba(48,48,48,.72)}
#splitButton{display:none;position:absolute;top:69%;left:50%;width:min(26.76vw,114px);min-width:100px;height:29px;transform:translate(-50%,12px) scale(.78);border:0;border-radius:28px;background:#fff;color:#04060d;padding:6px 10px;box-shadow:0 6px 22px rgba(0,0,0,.24);align-items:center;justify-content:center;gap:8px;font-family:"SF Pro Text","SF Pro Display",-apple-system,BlinkMacSystemFont,sans-serif;font-size:14px;font-weight:400;line-height:17px;letter-spacing:0;opacity:0;z-index:8;pointer-events:auto;-webkit-tap-highlight-color:transparent;will-change:transform,opacity}
#splitButton.show{display:flex;animation:splitBillAppear 620ms cubic-bezier(.18,1.35,.36,1) forwards}
#splitButton:active{transform:translate(-50%,0) scale(.93);filter:brightness(.94)}
.splitIcon{width:14px;height:14px;flex:0 0 14px;display:block}
.splitLabel{white-space:nowrap}
.splitDismiss{width:16px;height:16px;flex:0 0 16px;display:grid;place-items:center;color:#000;font-size:16px;font-weight:400;line-height:1}
@keyframes splitBillAppear{0%{opacity:0;transform:translate(-50%,12px) scale(.78)}65%{opacity:1;transform:translate(-50%,-1px) scale(1.04)}100%{opacity:1;transform:translate(-50%,0) scale(1)}}
@media (prefers-reduced-motion:reduce){#splitButton.show{animation-duration:1ms}}
#status{position:absolute;top:calc(env(safe-area-inset-top) + 15px);left:50%;transform:translateX(-50%);padding:7px 12px;border-radius:16px;background:rgba(0,0,0,.55);font-size:11px;opacity:0;transition:.2s;z-index:20}
#status.show{opacity:1}
#permission{position:absolute;inset:0;background:#000;display:none;align-items:center;justify-content:center;text-align:center;padding:30px;z-index:30}
#permission.show{display:flex}
#permission button{margin-top:16px;border:0;border-radius:16px;padding:13px 18px;font-weight:700}
#billScreen{display:none;position:absolute;inset:0;overflow:hidden;color:#fff;background:#080808;z-index:40;font-family:"SF Pro Display","SF Pro Text",-apple-system,BlinkMacSystemFont,sans-serif;will-change:transform,opacity}
.show-bill #video,.show-bill .layer,.show-bill #status{display:none}
.show-bill #billScreen{display:block}
.billBackdrop{position:absolute;inset:-26px;background:linear-gradient(180deg,rgba(0,0,0,.18) 0%,rgba(0,0,0,.5) 40%,rgba(77,18,213,.72) 100%),url("assets/home-screen.png") center/cover;filter:blur(15px) saturate(.8);transform:scale(1.08)}
.billGlow{position:absolute;inset:0;background:radial-gradient(ellipse 72% 42% at 54% 76%,rgba(206,145,255,.6),transparent 72%),linear-gradient(180deg,rgba(0,0,0,.08),rgba(30,0,92,.34) 100%)}
.billPanel{position:absolute;top:var(--bill-panel-top,93.5px);left:50%;width:346px;height:584px;transform:translateX(-50%) scale(var(--bill-scale,1));transform-origin:top center;padding:10px;border-radius:40px;background:#101010;box-shadow:0 24px 55px rgba(0,0,0,.5);overflow:hidden}
.billHero{position:relative;height:202px;border-radius:34px 34px 40px 40px;background:#298700 url("assets/bill-green.png") center/cover;overflow:hidden;text-align:center}
.billProgress{position:absolute;top:18px;left:50%;width:104px;transform:translateX(-50%);display:flex;gap:6px}.billProgress span{height:8px;flex:1;border-radius:999px;background:rgba(255,255,255,.35)}.billProgress span:first-child{background:#fff}
.billEyebrow{margin:0;padding-top:28px;font-size:15px;font-weight:700;letter-spacing:2px}.billAmount{margin-top:9px;font-size:clamp(48px,15.5vw,63px);font-weight:700;line-height:.92;letter-spacing:-2.2px}.billMeta{margin-top:12px;color:rgba(255,255,255,.85);font-size:13px;font-weight:500;letter-spacing:1.65px;white-space:nowrap}.billCount{display:inline-flex;align-items:center;justify-content:center;height:31px;margin-top:13px;padding:0 16px;border:1px solid rgba(255,255,255,.44);border-radius:24px;background:rgba(255,255,255,.16);box-shadow:inset 0 1px 0 rgba(255,255,255,.42),inset 0 -1px 0 rgba(0,0,0,.12);backdrop-filter:blur(4px) saturate(1.25);-webkit-backdrop-filter:blur(4px) saturate(1.25);font-size:13px}
.billDetails{padding:18px 8px 0}.billTax{margin:0 0 16px;color:#a6a6a8;text-align:center;font-size:12px;line-height:15px;white-space:nowrap}.billRows{display:grid;gap:12px}.billRow{height:48px;display:flex;align-items:center;gap:12px;padding:6px 16px;border:1px solid rgba(255,255,255,.34);border-radius:20px;background:rgba(255,255,255,.10);box-shadow:inset 0 1px 0 rgba(255,255,255,.31),inset 0 -1px 0 rgba(0,0,0,.12);backdrop-filter:blur(4px) saturate(1.25);-webkit-backdrop-filter:blur(4px) saturate(1.25)}
.foodThumb{width:38px;height:36px;flex:0 0 38px;object-fit:contain}.billItemName{min-width:0;flex:1;font-size:17px;font-weight:400;white-space:nowrap}.billQuantity{font-size:16px}.billPrice{font-size:18px;font-weight:700;white-space:nowrap}.billHint{margin:13px 0 0;color:#a6a6a8;text-align:center;font-size:12px;line-height:15px}
.friendsButton{position:absolute;top:var(--friends-top,733px);left:50%;width:243px;height:52px;transform:translateX(-50%) scale(var(--bill-scale,1));transform-origin:top center;border:0;border-radius:28px;background:#fff;color:#07070a;display:flex;align-items:center;justify-content:center;gap:10px;font:600 17px/19px "SF Pro Display","SF Pro Text",-apple-system,BlinkMacSystemFont,sans-serif;box-shadow:0 12px 30px rgba(0,0,0,.23);-webkit-tap-highlight-color:transparent}.friendsButton:active{transform:translateX(-50%) scale(calc(var(--bill-scale,1) * .96))}.friendsPlus{width:24px;height:24px;display:grid;place-items:center;border:2px solid #08080a;border-radius:50%;font-size:24px;font-weight:400;line-height:18px}
@keyframes billScreenSlideIn{0%{opacity:.72;transform:translate3d(100%,0,0)}68%{opacity:1;transform:translate3d(-1.2%,0,0)}100%{opacity:1;transform:translate3d(0,0,0)}}
@keyframes billHeroIn{0%{opacity:0;transform:translateY(18px) scale(.965)}70%{opacity:1;transform:translateY(-1px) scale(1.006)}100%{opacity:1;transform:translateY(0) scale(1)}}
@keyframes billContentIn{0%{opacity:0;transform:translateY(14px);filter:blur(3px)}72%{opacity:1;transform:translateY(-1px);filter:blur(0)}100%{opacity:1;transform:translateY(0);filter:blur(0)}}
@keyframes billRowIn{0%{opacity:0;transform:translateY(16px) scale(.975)}72%{opacity:1;transform:translateY(-1px) scale(1.004)}100%{opacity:1;transform:translateY(0) scale(1)}}
@keyframes friendsButtonIn{0%{opacity:0;transform:translateX(-50%) translateY(22px) scale(calc(var(--bill-scale,1) * .92))}72%{opacity:1;transform:translateX(-50%) translateY(-1px) scale(calc(var(--bill-scale,1) * 1.015))}100%{opacity:1;transform:translateX(-50%) translateY(0) scale(var(--bill-scale,1))}}
.show-bill.bill-entering #billScreen{animation:billScreenSlideIn 620ms cubic-bezier(.22,1,.36,1) both}
.show-bill.bill-entering .billHero{animation:billHeroIn 560ms 105ms cubic-bezier(.22,1,.36,1) both}
.show-bill.bill-entering .billProgress{animation:billContentIn 380ms 175ms cubic-bezier(.22,1,.36,1) both}
.show-bill.bill-entering .billEyebrow{animation:billContentIn 430ms 180ms cubic-bezier(.22,1,.36,1) both}
.show-bill.bill-entering .billAmount{animation:billContentIn 480ms 240ms cubic-bezier(.22,1,.36,1) both}
.show-bill.bill-entering .billMeta{animation:billContentIn 440ms 300ms cubic-bezier(.22,1,.36,1) both}
.show-bill.bill-entering .billCount{animation:billContentIn 440ms 350ms cubic-bezier(.22,1,.36,1) both}
.show-bill.bill-entering .billTax{animation:billContentIn 420ms 320ms cubic-bezier(.22,1,.36,1) both}
.show-bill.bill-entering .billRow{animation:billRowIn 470ms cubic-bezier(.22,1,.36,1) both}.show-bill.bill-entering .billRow:nth-child(1){animation-delay:390ms}.show-bill.bill-entering .billRow:nth-child(2){animation-delay:445ms}.show-bill.bill-entering .billRow:nth-child(3){animation-delay:500ms}.show-bill.bill-entering .billRow:nth-child(4){animation-delay:555ms}.show-bill.bill-entering .billRow:nth-child(5){animation-delay:610ms}
.show-bill.bill-entering .billHint{animation:billContentIn 420ms 665ms cubic-bezier(.22,1,.36,1) both}
.show-bill.bill-entering .friendsButton{animation:friendsButtonIn 540ms 710ms cubic-bezier(.22,1,.36,1) both}
@media (prefers-reduced-motion:reduce){.show-bill.bill-entering #billScreen,.show-bill.bill-entering .billHero,.show-bill.bill-entering .billProgress,.show-bill.bill-entering .billEyebrow,.show-bill.bill-entering .billAmount,.show-bill.bill-entering .billMeta,.show-bill.bill-entering .billCount,.show-bill.bill-entering .billTax,.show-bill.bill-entering .billRow,.show-bill.bill-entering .billHint,.show-bill.bill-entering .friendsButton{animation-duration:1ms!important;animation-delay:0ms!important}}
</style>
</head>
<body>
<div id="app">
<video id="video" autoplay playsinline muted></video>

<div id="permission">
  <div>
    <div style="font-size:21px;font-weight:700">Camera access</div>
    <div style="margin-top:8px;color:#aaa;font-size:14px;line-height:1.4">Allow camera access to scan your bill.</div>
    <button id="enable">Enable Camera</button>
  </div>
</div>

<div class="layer">
  <div class="topbar">
    <div class="control-group">
      <button class="control" aria-label="flash">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8"><path d="M13 2 4 13h7l-1 9 9-12h-7l1-8Z"/></svg>
      </button>
      <button class="control text">HEIF</button>
      <button class="control text">24</button>
    </div>
    <div class="control-group">
      <button class="control"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.7"><path d="M4 8V5h3M20 8V5h-3M4 16v3h3M20 16v3h-3"/><circle cx="12" cy="12" r="3"/></svg></button>
      <button class="control"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8"><circle cx="12" cy="12" r="8"/><path d="M8 12h8M12 8v8"/></svg></button>
    </div>
  </div>

  <div id="detectedTop">
    <div class="liveText">Copy</div><div class="sep"></div>
    <div class="liveText">Select All</div><div class="sep"></div>
    <div class="liveText">⌘</div><div class="sep"></div>
    <div class="look">Look Up</div>
    <div class="chev"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><path d="m9 5 7 7-7 7"/></svg></div>
  </div>

  <div id="detectedTools">
    <button class="control">☾</button><button class="control">ϟ</button><button class="control">◉</button><button class="control">•••</button>
  </div>

  <div id="billCard"><div id="scanLine"></div></div>

  <button id="splitButton" aria-label="Split bill">
    <span class="splitIcon">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg"><rect width="14" height="14" rx="2" fill="#0A1020"/><path d="M12.5 4.08333C12.5 3.76117 12.2388 3.5 11.9167 3.5H6.66667C6.34449 3.5 6.08333 3.76117 6.08333 4.08333C6.08333 4.4055 6.34449 4.66667 6.66667 4.66667H11.9167C12.2388 4.66667 12.5 4.4055 12.5 4.08333ZM4.91667 4.08333C4.91667 3.76117 4.6555 3.5 4.33333 3.5H2.58333C2.26117 3.5 2 3.76117 2 4.08333C2 4.4055 2.26117 4.66667 2.58333 4.66667H4.33333C4.6555 4.66667 4.91667 4.4055 4.91667 4.08333ZM12.5 7.41667C12.5 7.0945 12.2388 6.83333 11.9167 6.83333H6.66667C6.34449 6.83333 6.08333 7.0945 6.08333 7.41667C6.08333 7.73884 6.34449 8 6.66667 8H11.9167C12.2388 8 12.5 7.73884 12.5 7.41667ZM4.91667 7.41667C4.91667 7.0945 4.6555 6.83333 4.33333 6.83333H2.58333C2.26117 6.83333 2 7.0945 2 7.41667C2 7.73884 2.26117 8 2.58333 8H4.33333C4.6555 8 4.91667 7.73884 4.91667 7.41667ZM12.5 10.75C12.5 10.4278 12.2388 10.1667 11.9167 10.1667H6.66667C6.34449 10.1667 6.08333 10.4278 6.08333 10.75C6.08333 11.0722 6.34449 11.3333 6.66667 11.3333H11.9167C12.2388 11.3333 12.5 11.0722 12.5 10.75ZM4.91667 10.75C4.91667 10.4278 4.6555 10.1667 4.33333 10.1667H2.58333C2.26117 10.1667 2 10.4278 2 10.75C2 11.0722 2.26117 11.3333 2.58333 11.3333H4.33333C4.6555 11.3333 4.91667 11.0722 4.91667 10.75Z" fill="white"/></svg>
    </span>
    <span class="splitLabel">Split bill</span>
    <span class="splitDismiss" aria-hidden="true">×</span>
  </button>

  <div class="bottom">
    <div class="actionRow">
      <button class="side left" aria-label="photos"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.7"><rect x="4" y="5" width="16" height="14" rx="2"/><circle cx="9" cy="10" r="1.5"/><path d="m5 17 5-5 3 3 2-2 4 4"/></svg></button>
      <div class="shutter"></div>
      <button id="flipCamera" class="side right" aria-label="Flip camera"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v-3a3 3 0 0 1 3 -3h13m-3 -3l3 3l-3 3"/><path d="M20 12v3a3 3 0 0 1 -3 3h-13m3 3l-3 -3l3 -3"/></svg></button>
    </div>
    <div class="modes"><div class="modebar"><div class="mode">VIDEO</div><div class="mode active">PHOTO</div></div></div>
  </div>
</div>

<section id="billScreen" aria-label="Split Bill summary">
  <div class="billBackdrop"></div><div class="billGlow"></div>
  <article class="billPanel">
    <header class="billHero">
      <div class="billProgress"><span></span><span></span><span></span></div>
      <p class="billEyebrow">SPLIT BILL</p>
      <div class="billAmount">₹451.50</div>
      <div class="billMeta">SRI KAVERI MESS · 25 OCT 2026</div>
      <div class="billCount">5 items found</div>
    </header>
    <div class="billDetails">
      <p class="billTax">GST 5% ₹21.50 &nbsp; · &nbsp; Subtotal ₹430</p>
      <div class="billRows">
        <div class="billRow"><img class="foodThumb" src="assets/Masala%20dosa.png" alt=""><span class="billItemName">Masala Dosa</span><strong class="billPrice">₹110</strong></div>
        <div class="billRow"><img class="foodThumb" src="assets/podei%20dosa.png" alt=""><span class="billItemName">Podi Dosa</span><strong class="billPrice">₹95</strong></div>
        <div class="billRow"><img class="foodThumb" src="assets/Idli.png" alt=""><span class="billItemName">Idli,</span><strong class="billPrice">₹60</strong></div>
        <div class="billRow"><img class="foodThumb" src="assets/Parotta.png" alt=""><span class="billItemName">Parotta</span><strong class="billPrice">₹60</strong></div>
        <div class="billRow"><img class="foodThumb" src="assets/Coffee.png" alt=""><span class="billItemName">Filter Coffee</span><span class="billQuantity">×3</span><strong class="billPrice">₹105</strong></div>
      </div>
      <p class="billHint">Tap items to edit</p>
    </div>
  </article>
  <button class="friendsButton" type="button"><span class="friendsPlus">+</span>Add Friends to split</button>
</section>

<div id="status"></div>
<script>
const video=document.getElementById('video');
const permission=document.getElementById('permission');
const enable=document.getElementById('enable');
const status=document.getElementById('status');
const detectedTop=document.getElementById('detectedTop');
const detectedTools=document.getElementById('detectedTools');
const splitButton=document.getElementById('splitButton');
const billCard=document.getElementById('billCard');
const flipCamera=document.getElementById('flipCamera');
let stream=null;
let facingMode='environment';
let scanTimer=null;
let scanInProgress=false;
let receiptFound=false;
let scanAttempts=0;

const receiptTerms=/\b(total|subtotal|grand\s*total|amount\s*due|balance\s*due|tax|vat|gst|cash|change|receipt|invoice|bill)\b/i;
const moneyAmount=/(?:₹|rs\.?|inr|\$|€|£)?\s*\d{1,6}(?:[,.]\d{2})\b/gi;

function syncBillScale(){
  const scale=Math.min(1,window.innerWidth/393,window.innerHeight/852);
  document.documentElement.style.setProperty('--bill-scale',String(scale));
  document.documentElement.style.setProperty('--bill-panel-top',`${93.5*scale}px`);
  document.documentElement.style.setProperty('--friends-top',`${733*scale}px`);
}

function toast(t){status.textContent=t;status.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>status.classList.remove('show'),1800)}

async function startCamera(){
  if(!window.isSecureContext && location.hostname!=='localhost' && location.hostname!=='127.0.0.1'){
    permission.classList.add('show');
    toast('Open this page using HTTPS');
    return;
  }
  if(!navigator.mediaDevices?.getUserMedia){
    permission.classList.add('show'); return;
  }
  try{
    stream=await navigator.mediaDevices.getUserMedia({
      audio:false,
      video:{facingMode:{exact:facingMode},width:{ideal:1920},height:{ideal:1080}}
    });
    video.srcObject=stream;
    await video.play();
    toast('Camera ready');
    startReceiptDetection();
  }catch(e){
    try{
      stream=await navigator.mediaDevices.getUserMedia({audio:false,video:true});
      video.srcObject=stream; await video.play();
      startReceiptDetection();
    }catch(err){
      permission.classList.add('show');
      toast('Camera permission denied');
    }
  }
}

function stopReceiptDetection(){
  clearInterval(scanTimer);
  scanTimer=null;
}

function isReceiptText(text){
  const amounts=(text.match(moneyAmount)||[]).length;
  const hasReceiptTerm=receiptTerms.test(text);
  const lines=text.split(/\n+/).filter(line=>line.trim().length>2).length;
  return (hasReceiptTerm&&amounts>=1)||(amounts>=3&&lines>=4);
}

async function scanForReceipt(){
  if(receiptFound||scanInProgress||video.readyState<video.HAVE_CURRENT_DATA||!window.Tesseract)return;
  scanInProgress=true;
  try{
    const scale=Math.min(1,960/video.videoWidth);
    const canvas=document.createElement('canvas');
    canvas.width=Math.max(1,Math.round(video.videoWidth*scale));
    canvas.height=Math.max(1,Math.round(video.videoHeight*scale));
    canvas.getContext('2d',{willReadFrequently:true}).drawImage(video,0,0,canvas.width,canvas.height);
    const result=await Tesseract.recognize(canvas,'eng',{logger:()=>{}});
    scanAttempts++;
    if(isReceiptText(result.data.text)){
      receiptFound=true;
      stopReceiptDetection();
      showDetected();
    }
  }catch(error){
    // Keep camera scanning available if OCR is temporarily unavailable.
  }finally{
    scanInProgress=false;
    if(scanAttempts>=20)stopReceiptDetection();
  }
}

function startReceiptDetection(){
  stopReceiptDetection();
  receiptFound=false;
  scanAttempts=0;
  scanForReceipt();
  scanTimer=setInterval(scanForReceipt,2500);
}

function showDetected(){
  detectedTop.classList.add('show');
  detectedTools.classList.add('show');
  billCard.classList.add('show');
  splitButton.classList.add('show');
  document.getElementById('scanLine').style.display='none';
  toast('Bill detected');
}

enable.onclick=()=>{permission.classList.remove('show');startCamera()};
splitButton.onclick=()=>{
  stopReceiptDetection();
  document.body.classList.remove('bill-entering');
  document.body.classList.add('show-bill');
  requestAnimationFrame(()=>document.body.classList.add('bill-entering'));
};

flipCamera.onclick=async()=>{
  facingMode=facingMode==='environment'?'user':'environment';
  stopReceiptDetection();
  stream?.getTracks().forEach(track=>track.stop());
  await startCamera();
};

// Manual fallback for devices where OCR is unavailable.
let taps=0,timer;
document.getElementById('app').addEventListener('click',e=>{
  if(e.target.closest('#splitButton')||e.target.closest('#permission'))return;
  taps++; clearTimeout(timer); timer=setTimeout(()=>taps=0,650);
  if(taps===3){taps=0;showDetected()}
});

syncBillScale();
window.addEventListener('resize',syncBillScale,{passive:true});
startCamera();
</script>
